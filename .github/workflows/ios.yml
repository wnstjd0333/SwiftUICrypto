name: iOS Auto Xcode Workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Select Latest Xcode
        id: select-xcode
        run: |
          echo "🔍 Installed Xcode versions:"
          ls -1d /Applications/Xcode*.app

          # 가장 최신 버전을 선택 (숫자 기준 정렬 후 마지막 선택)
          LATEST_XCODE=$(ls -1d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "✅ Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"

          # 저장해서 이후 step에서 사용 가능하도록
          echo "xcode_path=$LATEST_XCODE" >> $GITHUB_OUTPUT

      - name: Show Selected Xcode Version
        run: |
          xcodebuild -version
          which xcodebuild

      - name: Build Project
        run: |
          SCHEME=$(xcodebuild -list -json | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['targets'][0]")
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          DESTINATION=$(xcrun simctl list devices available | grep 'iPhone' | grep -v unavailable | head -n1 | awk -F '[()]' '{print "platform=iOS Simulator,name="$1",OS="$2}')
          
          echo "🏗️ Building scheme: $SCHEME"
          echo "📱 Destination: $DESTINATION"
          
          xcodebuild build-for-testing \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION"

      - name: Run Tests
        run: |
          SCHEME=$(xcodebuild -list -json | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['targets'][0]")
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          DESTINATION=$(xcrun simctl list devices available | grep 'iPhone' | grep -v unavailable | head -n1 | awk -F '[()]' '{print "platform=iOS Simulator,name="$1",OS="$2}')
          
          echo "🧪 Testing scheme: $SCHEME"
          echo "📱 Destination: $DESTINATION"
          
          xcodebuild test-without-building \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION"
