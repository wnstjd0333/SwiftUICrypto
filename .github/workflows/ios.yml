name: iOS Build & Test

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  ios-build-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Show installed Xcode version
        run: /usr/bin/xcodebuild -version

      - name: 📦 Detect project file (.xcodeproj or .xcworkspace)
        id: detect_project
        run: |
          if ls -A | grep -iq \.xcworkspace$; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i \.xcworkspace$)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i \.xcodeproj$)" >> "$GITHUB_OUTPUT"
          fi

      - name: ⚙️ Detect scheme
        id: scheme
        run: |
          SCHEME=$(xcodebuild -list -${{ steps.detect_project.outputs.filetype }} "${{ steps.detect_project.outputs.file }}" -json | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['schemes'][0]")
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: 📱 Detect available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_INFO=$(xcrun simctl list devices available | grep -E "iPhone 1[5-6] Pro Max|iPhone 1[5-6] Pro|iPhone 1[5-6]" | head -n 1)
          DEVICE_NAME=$(echo "$SIMULATOR_INFO" | awk -F '[()]' '{print $1}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          DEVICE_OS=$(echo "$SIMULATOR_INFO" | awk -F '[()]' '{print $2}')
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "device_os=$DEVICE_OS" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build for testing
        run: |
          DESTINATION="platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }},OS=${{ steps.simulator.outputs.device_os }}"
          echo "Using simulator: $DESTINATION"
          
          xcodebuild build-for-testing \
            -${{ steps.detect_project.outputs.filetype }} "${{ steps.detect_project.outputs.file }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination "$DESTINATION" \
            | xcpretty

      - name: ✅ Run tests without rebuilding
        run: |
          DESTINATION="platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }},OS=${{ steps.simulator.outputs.device_os }}"
          echo "Testing on: $DESTINATION"

          xcodebuild test-without-building \
            -${{ steps.detect_project.outputs.filetype }} "${{ steps.detect_project.outputs.file }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination "$DESTINATION" \
            | xcpretty
