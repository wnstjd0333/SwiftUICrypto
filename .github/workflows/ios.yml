name: iOS CI - Build and Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build and Test with Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Determine Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "Using default scheme: $default"
          echo "$default" > default_scheme.txt

      - name: Determine Available iPhone Simulator
        run: |
          device_line=$(xcrun simctl list devices available | grep -m 1 "iPhone")
          device_name=$(echo "$device_line" | sed -E 's/.*(iPhone[^()]*)\(.*/\1/' | awk '{$1=$1;print}')
          device_os=$(echo "$device_line" | grep -oE '\([0-9.]+\)' | tr -d '()')
          echo "📱 Using simulator: $device_name ($device_os)"
          echo "device_name=$device_name" >> $GITHUB_ENV
          echo "device_os=$device_os" >> $GITHUB_ENV

      - name: Build for Testing
        run: |
          scheme=$(cat default_scheme.txt)
          if ls -A | grep -iq \.xcworkspace$; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i \.xcworkspace$)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i \.xcodeproj$)
          fi
          destination="platform=iOS Simulator,name=${{ env.device_name }},OS=${{ env.device_os }}"
          echo "🏗️ Building scheme: $scheme"
          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -$filetype_parameter "$file_to_build" \
            -destination "$destination"

      - name: Run Tests
        run: |
          scheme=$(cat default_scheme.txt)
          if ls -A | grep -iq \.xcworkspace$; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i \.xcworkspace$)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i \.xcodeproj$)
          fi
          destination="platform=iOS Simulator,name=${{ env.device_name }},OS=${{ env.device_os }}"
          echo "🧪 Testing scheme: $scheme"
          xcodebuild test-without-building \
            -scheme "$scheme" \
            -$filetype_parameter "$file_to_build" \
            -destination "$destination"
