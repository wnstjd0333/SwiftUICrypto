name: iOS starter workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
        
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
          
      - name: Build
        run: |
          device_name="iPhone 15"
          device_os=$(xcrun simctl list devices | grep -A 10 "$device_name (" | grep -Eo "\([0-9\.]+\)" | head -n 1 | tr -d '()')
          if [ -z "$device_os" ]; then
            echo "❌ OS version could not be determined for device $device_name"
            exit 1
          fi
          destination="platform=iOS Simulator,name=$device_name,OS=$device_os"

          scheme=$(cat default)
          if ls -A | grep -iq \.xcworkspace$; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i \.xcworkspace$)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i \.xcodeproj$)
          fi
          
          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -$filetype_parameter "$file_to_build" \
            -destination "$destination"
      - name: Test
        run: |
          # xcrun xctrace returns via stderr, not the expected stdout (see https://developer.apple.com/forums/thread/663959)
          device_name="iPhone 15"
          device_os=$(xcrun simctl list devices | grep -A 10 "$device_name (" | grep -Eo "\([0-9\.]+\)" | head -n 1 | tr -d '()')
          if [ -z "$device_os" ]; then
            echo "❌ OS version could not be determined for device $device_name"
            exit 1
          fi
          destination="platform=iOS Simulator,name=$device_name,OS=$device_os"
          
          scheme=$(cat default)
          if ls -A | grep -iq \.xcworkspace$; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i \.xcworkspace$)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i \.xcodeproj$)
          fi
          xcodebuild test-without-building \
            -scheme "$scheme" \
            -$filetype_parameter "$file_to_build" \
            -destination "$destination"
